# Под-клиент для проверки связности (wget, ping).
# busybox: entrypoint — sh, поэтому команда sleep работает как обычно.
#
# Императивный аналог:
#   kubectl run client --image=busybox:1.36 --restart=Never -- sleep 3600
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: default
  labels:
    run: client
    role: client
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
