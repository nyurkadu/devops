# =============================================================================
#  00-namespace.yaml  —  Namespace "lab"
# =============================================================================
#
#  ЧТО ЭТО ДЕЛАЕТ
#  Создаёт изолированное пространство имён, в котором будут жить ВСЕ объекты
#  этой лекции. Namespace — это не сеть и не машина, а всего лишь префикс
#  в ключе, под которым объект лежит в etcd. Два объекта с одинаковым именем
#  в разных namespace — это два разных объекта.
#
#  ЗАЧЕМ ОТДЕЛЬНЫЙ NAMESPACE
#  1. Уборка одной командой: delete namespace сносит всё содержимое разом.
#  2. Изоляция от чужих NetworkPolicy. Политика с пустым podSelector в чужом
#     namespace может молча блокировать трафик и испортить демонстрацию.
#  3. Ничего из прошлых уроков не пострадает.
#
#  ИМПЕРАТИВНЫЙ ЭКВИВАЛЕНТ (то, что заменяет этот файл)
#      kubectl create namespace lab
#
#  ПРИМЕНИТЬ
#      kubectl apply -f k8s-anatomy/00-namespace.yaml
#
#  СДЕЛАТЬ ТЕКУЩИМ (чтобы не писать -n lab в каждой команде)
#      kubectl config set-context --current --namespace=lab
#
#  ПРОВЕРИТЬ
#      kubectl get namespace lab
#      kubectl config view --minify -o jsonpath='{..namespace}'
#
# =============================================================================

apiVersion: v1                 # Namespace — объект core-группы, версия всегда v1
kind: Namespace                # тип объекта; определяет, какой контроллер им займётся
metadata:
  name: lab                    # имя namespace; именно оно попадёт в ключ etcd
  labels:
    # Метки на namespace нужны не для красоты: NetworkPolicy умеет выбирать
    # namespace через namespaceSelector, и матчится он именно по этим меткам.
    # Без метки на namespace правило "разрешить трафик из namespace lab"
    # написать невозможно.
    name: lab
    purpose: lecture-020
