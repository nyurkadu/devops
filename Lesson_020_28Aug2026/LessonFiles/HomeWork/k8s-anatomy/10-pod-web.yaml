# =============================================================================
#  10-pod-web.yaml  —  Pod "web": один контейнер в спеке, ДВА на ноде
# =============================================================================
#
#  ЧТО ЭТО ДЕЛАЕТ
#  Создаёт один-единственный под с одним контейнером nginx. Это самый нижний
#  уровень, который планировщик умеет размещать: Kubernetes НИКОГДА не
#  планирует отдельный контейнер, только под целиком.
#
#  ГЛАВНОЕ НАБЛЮДЕНИЕ ЭТОГО ФАЙЛА
#  В спеке описан ОДИН контейнер, а на ноде запустится ДВА. Второй —
#  pause-контейнер, его добавляет container runtime, а не вы. Pause стартует
#  первым, создаёт сетевой namespace и получает podIP; контейнер приложения
#  затем подсаживается в уже готовый netns. Отсюда три следствия:
#    * у пода один IP на всех контейнеров, а не по IP на контейнер;
#    * контейнеры пода видят друг друга по localhost;
#    * рестарт приложения НЕ меняет IP — netns держит pause.
#
#  ЭТО "ГОЛЫЙ" ПОД — У НЕГО НЕТ КОНТРОЛЛЕРА
#  Удалите его, и он не вернётся: над ним нет ни ReplicaSet, ни Deployment.
#  Сравните с поведением подов из 30-deployment-shop.yaml — там удалённый под
#  тут же заменяется новым.
#
#  ИМПЕРАТИВНЫЙ ЭКВИВАЛЕНТ
#      kubectl run web --image=nginx:alpine --port=80
#
#  ПРИМЕНИТЬ
#      kubectl apply -f k8s-anatomy/10-pod-web.yaml
#      kubectl wait --for=condition=Ready pod/web -n lab --timeout=90s
#
#  ПРОВЕРИТЬ, ЧТО КОНТЕЙНЕРОВ ДВА
#      $node = (kubectl get pod web -n lab -o jsonpath='{.spec.nodeName}')
#      minikube ssh -p calico -n $node -- "docker ps --filter name=_web_lab_ --format '{{.Names}}'"
#      # k8s_web_web_lab_<uid>_0    <- ваш nginx
#      # k8s_POD_web_lab_<uid>_0    <- pause, добавлен runtime
#
#  УДАЛИТЬ
#      kubectl delete -f k8s-anatomy/10-pod-web.yaml
#
# =============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: web                    # имя пода; у "голого" пода оно постоянное,
                               # в отличие от подов ReplicaSet со случайным суффиксом
  namespace: lab               # явно указываем namespace, чтобы файл не зависел
                               # от того, какой контекст сейчас текущий
  labels:
    app: web                   # метка — единственный способ, которым Service,
                               # ReplicaSet и NetworkPolicy находят этот под.
                               # Имя пода для них не существует, только метки.
spec:
  # ---------------------------------------------------------------------------
  #  containers — список контейнеров приложения.
  #  Pause-контейнера здесь НЕТ и быть не может: его добавляет runtime.
  # ---------------------------------------------------------------------------
  containers:
    - name: web                # имя контейнера ВНУТРИ пода; попадает в имя
                               # docker-контейнера: k8s_<это_имя>_<под>_<ns>_<uid>_<n>
      image: nginx:alpine      # конкретный образ; тег alpine — компактный вариант
      imagePullPolicy: IfNotPresent   # не ходить в реестр, если образ уже на ноде.
                                      # Для тега latest умолчание было бы Always.
      ports:
        - name: http           # имя порта; на него можно ссылаться из Service
                               # через targetPort: http вместо числа
          containerPort: 80    # ВАЖНО: это поле НИЧЕГО не открывает и не
                               # публикует. Оно чисто информационное — просто
                               # документирует, что процесс слушает 80.
                               # Контейнер доступен по этому порту независимо
                               # от наличия этой строки.
          protocol: TCP

      # -----------------------------------------------------------------------
      #  resources — то, что реально доезжает до ядра в виде cgroup-лимитов.
      #  requests читает ПЛАНИРОВЩИК, чтобы выбрать ноду.
      #  limits  читает KUBELET, чтобы настроить cgroup.
      # -----------------------------------------------------------------------
      resources:
        requests:
          cpu: 50m             # 50 millicores = 0.05 ядра. Планировщик вычтет
                               # это из allocatable ноды при выборе места.
          memory: 32Mi
        limits:
          cpu: 200m            # превышение CPU -> процесс троттлится (замедляется)
          memory: 128Mi        # превышение памяти -> процесс убивает OOM-killer
                               # ядра. Это разное поведение, легко перепутать.

      # -----------------------------------------------------------------------
      #  Проба готовности. Пока она не прошла, под считается NotReady и его IP
      #  НЕ попадает в EndpointSlice — то есть Service не будет слать сюда трафик.
      # -----------------------------------------------------------------------
      readinessProbe:
        httpGet:
          path: /
          port: http           # ссылка на имя порта, объявленное выше
        initialDelaySeconds: 2
        periodSeconds: 5

  # ---------------------------------------------------------------------------
  #  restartPolicy для пода без контроллера. Always — kubelet сам поднимет
  #  упавший контейнер В ТОМ ЖЕ поде (podIP сохранится, restartCount вырастет).
  #  Это НЕ то же самое, что пересоздание пода контроллером.
  # ---------------------------------------------------------------------------
  restartPolicy: Always

  # Сколько секунд дать процессу на корректное завершение после SIGTERM,
  # прежде чем прислать SIGKILL. Умолчание 30, здесь ускоряем демонстрацию.
  terminationGracePeriodSeconds: 5
