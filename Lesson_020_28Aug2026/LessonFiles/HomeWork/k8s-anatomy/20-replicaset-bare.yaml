# =============================================================================
#  20-replicaset-bare.yaml  —  "голый" ReplicaSet без Deployment над ним
# =============================================================================
#
#  ЗАЧЕМ ЭТОТ ФАЙЛ
#  В боевой практике ReplicaSet руками не создают — его создаёт Deployment.
#  Но чтобы понять, ЧТО ИМЕННО делает Deployment, нужно один раз увидеть
#  слой под ним отдельно. Этот файл — учебный препарат.
#
#  ЧТО УМЕЕТ REPLICASET
#  Ровно одно: держать N подов, подходящих под selector. Бесконечный цикл
#  в процессе kube-controller-manager на control-plane:
#      посчитать поды по селектору -> сравнить с replicas ->
#      меньше: создать по template / больше: удалить лишние
#
#  ЧЕГО REPLICASET НЕ УМЕЕТ (и ради чего существует Deployment)
#    * менять образ без простоя — нет стратегии обновления;
#    * помнить предыдущую версию — нет истории ревизий;
#    * откатываться — откатывать некуда.
#  Поменяйте здесь image и применитe заново: НИЧЕГО не произойдёт. Старые поды
#  продолжат работать на старом образе, потому что их количество уже верное.
#  Новый образ увидят только те поды, что будут созданы позже. Это и есть
#  главный аргумент в пользу Deployment.
#
#  ГДЕ ФИЗИЧЕСКИ ЛЕЖИТ ЭТОТ ОБЪЕКТ
#  Запись в etcd на control-plane (файл /var/lib/minikube/etcd/member/snap/db).
#  На нодах с подами — НОЛЬ БАЙТ. Процесса с именем "replicaset" не существует.
#
#  ИМПЕРАТИВНОГО ЭКВИВАЛЕНТА НЕТ
#  kubectl create не умеет создавать ReplicaSet — только через манифест.
#
#  ПРИМЕНИТЬ
#      kubectl apply -f k8s-anatomy/20-replicaset-bare.yaml
#
#  УВИДЕТЬ ЦИКЛ СВЕРКИ В ДЕЙСТВИИ
#      kubectl get pods -n lab -l app=bare -o wide
#      $pod = (kubectl get pods -n lab -l app=bare -o jsonpath='{.items[0].metadata.name}')
#      kubectl delete pod $pod -n lab
#      kubectl get pods -n lab -l app=bare
#      # подов снова 3, но один моложе остальных и с ДРУГИМ именем.
#      # Реплика не восстанавливается — она ЗАМЕНЯЕТСЯ новой по template.
#
#  УВИДЕТЬ СВЯЗЬ "ЧЕЙ ЭТО ПОД"
#      kubectl get pods -n lab -l app=bare -o jsonpath='{range .items[*]}{.metadata.name}{" <- "}{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}{"\n"}{end}'
#      # Указатель хранится СНИЗУ ВВЕРХ: в поде, а не в ReplicaSet.
#      # Это просто текстовое поле, никакого канала между объектами нет.
#
#  УДАЛИТЬ
#      kubectl delete -f k8s-anatomy/20-replicaset-bare.yaml
#
# =============================================================================

apiVersion: apps/v1            # ReplicaSet живёт в группе apps, не в core
kind: ReplicaSet
metadata:
  name: bare
  namespace: lab
  labels:
    app: bare
spec:
  # ---------------------------------------------------------------------------
  #  replicas — то самое "число реплик". Отдельного объекта "реплика"
  #  не существует: реплика — это ЦЕЛОЕ ЧИСЛО в этом поле, и ничего больше.
  #  Физическое воплощение числа 3 — три пода, и всё.
  # ---------------------------------------------------------------------------
  replicas: 3

  # ---------------------------------------------------------------------------
  #  selector — по нему контроллер считает "свои" поды.
  #  ВАЖНО: селектор считает ЛЮБОЙ подходящий под, даже созданный не им.
  #  Создайте руками под с меткой app=bare — и ReplicaSet усыновит его,
  #  а взамен удалит один из своих, чтобы общее число осталось 3.
  #  В apps/v1 это поле ИММУТАБЕЛЬНО: изменить его у существующего объекта
  #  нельзя, только пересоздать. Именно поэтому Deployment при смене образа
  #  создаёт НОВЫЙ ReplicaSet, а не правит существующий.
  # ---------------------------------------------------------------------------
  selector:
    matchLabels:
      app: bare

  # ---------------------------------------------------------------------------
  #  template — образец, по которому штампуются поды. Это вложенная спека
  #  пода без apiVersion и kind: они и так известны.
  #  ЖЕЛЕЗНОЕ ПРАВИЛО: метки в template.metadata.labels ОБЯЗАНЫ подходить
  #  под selector выше. Иначе контроллер создаст под, не увидит его своим,
  #  создаст ещё один, снова не увидит — и так до бесконечности.
  #  apiserver отклонит такой манифест с ошибкой "selector does not match template".
  # ---------------------------------------------------------------------------
  template:
    metadata:
      labels:
        app: bare              # <- обязано матчиться с spec.selector.matchLabels
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 150m, memory: 128Mi }
      terminationGracePeriodSeconds: 5
