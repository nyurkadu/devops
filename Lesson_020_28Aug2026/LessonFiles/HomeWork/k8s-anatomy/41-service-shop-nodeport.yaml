# =============================================================================
#  41-service-shop-nodeport.yaml  —  тот же Service, но типа NodePort
# =============================================================================
#
#  ЧТО ЭТО ДЕЛАЕТ
#  Полная замена файла 40: тот же объект shop-svc, но с type: NodePort.
#  Применяется поверх существующего сервиса — apply обновит его на месте,
#  ClusterIP при этом сохранится.
#
#  ЧТО МЕНЯЕТСЯ ФИЗИЧЕСКИ
#  NodePort = ClusterIP + ОДНО дополнительное правило в ядре КАЖДОЙ ноды.
#  Всё, что было (KUBE-SERVICES -> KUBE-SVC -> KUBE-SEP -> DNAT), остаётся;
#  сверху добавляется цепочка KUBE-NODEPORTS, ловящая трафик на порт 3xxxx
#  любого интерфейса ноды и отправляющая его в ту же цепочку сервиса.
#
#  ПОСМОТРЕТЬ ЭТО НОВОЕ ПРАВИЛО
#      minikube ssh -p calico -n calico -- "sudo iptables-save -t nat | grep KUBE-NODEPORTS"
#
#  ВАЖНО: ПОРТ ОТКРЫВАЕТСЯ НА ВСЕХ НОДАХ
#  Даже на тех, где нет ни одного пода этого сервиса. Пакет, пришедший на
#  "пустую" ноду, будет переброшен на ноду с подом — и вот тут сработает
#  SNAT (KUBE-MARK-MASQ), иначе под ответил бы напрямую внешнему клиенту
#  мимо ноды-входа, и conntrack там не нашёл бы соответствия.
#  Побочный эффект SNAT: под видит IP ноды, а не реальный IP клиента.
#
#  ИМПЕРАТИВНЫЙ ЭКВИВАЛЕНТ
#      kubectl patch svc shop-svc -n lab --type=merge -p '{"spec":{"type":"NodePort"}}'
#
#  ПРИМЕНИТЬ
#      kubectl apply -f k8s-anatomy/41-service-shop-nodeport.yaml
#      kubectl get svc shop-svc -n lab
#      # PORT(S) станет вида 80:31208/TCP
#
#  ОТКРЫТЬ СНАРУЖИ (Windows + драйвер docker)
#      minikube service shop-svc -p calico -n lab --url
#
#  ДВЕ ЛОВУШКИ ЭТОЙ КОМАНДЫ
#  1. Флаг -n здесь означает NAMESPACE, а у minikube ssh -n — НОДУ.
#     И minikube НЕ читает текущий namespace из kubeconfig: без -n lab
#     он пойдёт в default и ответит SVC_NOT_FOUND, даже если kubectl
#     в этот момент работает с lab без всяких флагов.
#  2. Команда НЕ завершается: она держит туннель, пока не нажмёте Ctrl+C.
#     Закроете — URL перестанет работать. Это нормальное поведение.
#
#  ЧТО ДОСТУПНО СНАРУЖИ ВООБЩЕ
#      minikube service list -p calico
#      # "No node port" в колонке TARGET PORT = это ClusterIP,
#      # для него --url не сработает: снаружи такого адреса не существует.
#
#  ВЕРНУТЬСЯ К ClusterIP
#      kubectl apply -f k8s-anatomy/40-service-shop-clusterip.yaml
#      # ВНИМАНИЕ: обратный переход через apply сработает, а вот через
#      # kubectl patch с type: ClusterIP нужно ещё и обнулить nodePort.
#
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: shop-svc               # ТО ЖЕ имя, что в файле 40 — это обновление,
  namespace: lab               # а не второй объект
  labels:
    app: shop
spec:
  type: NodePort               # <- единственное принципиальное отличие от файла 40

  selector:
    app: shop

  ports:
    - name: http
      protocol: TCP
      port: 80                 # порт на ClusterIP (внутри кластера)
      targetPort: http         # порт в поде
      nodePort: 31208          # порт на КАЖДОЙ ноде кластера.
                               # Допустимый диапазон по умолчанию: 30000-32767.
                               # Поле можно НЕ указывать — тогда Kubernetes
                               # выберет свободный сам. Здесь задан явно,
                               # чтобы адрес не менялся между пересозданиями
                               # и его можно было прописать в документации.
                               # Риск фиксированного значения: конфликт, если
                               # порт уже занят другим сервисом кластера.

  sessionAffinity: None

  # ---------------------------------------------------------------------------
  #  externalTrafficPolicy — только для NodePort и LoadBalancer.
  #    Cluster (умолчание) — принимать на любой ноде и при необходимости
  #                          перебрасывать на другую. Балансировка ровнее,
  #                          но source IP теряется из-за SNAT.
  #    Local               — обслуживать только поды СВОЕЙ ноды. Source IP
  #                          сохраняется, лишнего хопа нет, но ноды без подов
  #                          отвечают отказом, и распределение неравномерное.
  # ---------------------------------------------------------------------------
  externalTrafficPolicy: Cluster
