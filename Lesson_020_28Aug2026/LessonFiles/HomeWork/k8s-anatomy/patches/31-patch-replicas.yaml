# =============================================================================
#  31-patch-replicas.yaml  —  масштабирование как изменение ОДНОГО числа
# =============================================================================
#
#  ЧТО ЭТО ДЕЛАЕТ
#  Меняет у Deployment "shop" единственное поле: spec.replicas с 3 на 6.
#  Файл намеренно состоит из трёх строк — в этом вся мысль. "Добавить три
#  реплики" физически означает "записать в etcd число 6 вместо 3". Всё
#  остальное сделают контроллеры, никем не вызванные напрямую.
#
#  ЧТО ЭТО ЗА ФОРМАТ
#  Strategic merge patch — фрагмент объекта, который накладывается поверх
#  существующего. Поля, которых здесь нет, остаются как были. Это не полный
#  манифест: применять его через kubectl apply нельзя, только через patch.
#
#  ИМПЕРАТИВНЫЙ ЭКВИВАЛЕНТ
#      kubectl scale deployment shop --replicas=6 -n lab
#
#  ПРИМЕНИТЬ
#      kubectl patch deployment shop -n lab --patch-file k8s-anatomy/patches/31-patch-replicas.yaml
#
#  КАК ЭТО ДЕЛАЮТ В РЕАЛЬНОМ GITOPS
#  Патч-файл — приём для демонстрации. В настоящем проекте правят строку
#  replicas в самом 30-deployment-shop.yaml и делают apply: тогда git хранит
#  актуальное желаемое состояние, а не цепочку модификаций к нему.
#      kubectl apply -f k8s-anatomy/30-deployment-shop.yaml
#
#  ПОСМОТРЕТЬ РЕЗУЛЬТАТ
#      kubectl get pods -n lab -l app=shop -o wide
#
#      # сводка: сколько подов на каждой ноде
#      kubectl get pods -n lab -l app=shop -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' |
#        Group-Object | Select-Object Name, Count
#
#      # события: видно каждое решение контроллера и планировщика
#      kubectl get events -n lab --sort-by=.lastTimestamp | Select-Object -Last 12
#
#  ЧТО ЗАМЕТИТЬ В ВЫВОДЕ
#  Новый ReplicaSet НЕ создаётся. Хеш template не изменился — поменялось
#  только число рядом с ним. Сравните с 32-patch-image-v2.yaml, где меняется
#  template и RS появляется новый.
#
# =============================================================================

spec:
  replicas: 6                  # было 3. Одно число — и на нодах появятся
                               # три новых группы процессов.
