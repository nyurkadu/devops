# =============================================================================
#  60-networkpolicy-deny-all.yaml  —  запрет всего входящего трафика к shop
# =============================================================================
#
#  ЧТО ЭТО ДЕЛАЕТ
#  Запрещает ЛЮБОЙ входящий трафик к подам с меткой app=shop. Исходящий
#  трафик от них не трогает.
#
#  МОДЕЛЬ, КОТОРУЮ НАДО ПРИНЯТЬ КАК АКСИОМУ
#  1. Пока на под не действует НИ ОДНА политика — разрешено всё.
#  2. Как только под попал под хотя бы одну политику по нужному
#     policyTypes — запрещено всё, кроме явно разрешённого.
#  Промежуточного состояния нет. Политики только СКЛАДЫВАЮТСЯ (OR):
#  правил "запретить" в NetworkPolicy не существует в принципе.
#
#  ПОЧЕМУ ЭТОТ ФАЙЛ ЗАПРЕЩАЕТ, ЕСЛИ "DENY" НЕ БЫВАЕТ
#  Из-за пустого списка ingress: []. Под попал под политику -> действует
#  правило "разрешено только перечисленное" -> перечислено ноль вариантов ->
#  не разрешено ничего. Запрет получается как побочный эффект.
#  ВНИМАНИЕ на разницу:
#      ingress: []          <- запрещено всё (пустой СПИСОК правил)
#      ingress: [{}]        <- разрешено всё (одно ПУСТОЕ правило)
#      (поля ingress нет)   <- при policyTypes: [Ingress] тоже запрещено всё
#
#  ПОЛИТИКИ STATEFUL
#  Разрешив соединение, обратный трафик разрешать НЕ надо: решение
#  записывается в conntrack при первом пакете, ответы идут по готовой записи.
#  Это та же механика, из-за которой Service балансирует раз на соединение.
#
#  БЕЗ ПОДДЕРЖИВАЮЩЕГО CNI ЭТОТ ФАЙЛ НЕ ДЕЛАЕТ НИЧЕГО
#  apiserver проверит только схему и запишет объект в etcd. kubectl скажет
#  "created", kubectl get покажет политику, kubectl describe напечатает
#  правила — и ни один пакет не будет отфильтрован. Ни ошибки, ни warning,
#  ни события: у NetworkPolicy вообще НЕТ поля status, ей нечем сообщить,
#  что её никто не читает.
#  Поддерживают: Calico, Cilium, Antrea, Weave, Kube-router.
#  НЕ поддерживают: kindnet (умолчание minikube!), flannel.
#  Отсюда и профиль: minikube start -p calico --cni=calico --nodes=2
#
#  ПРИМЕНИТЬ — ОБЯЗАТЕЛЬНО В ЧЕТЫРЕ ШАГА
#      # ШАГ 1. КОНТРОЛЬНЫЙ ЗАМЕР ДО ПОЛИТИКИ. Не пропускать!
#      kubectl run t1 -n lab --rm -i --restart=Never --image=busybox:1.36 -- `
#        wget -qO- --timeout=4 http://shop-svc
#      # ожидаем <title>Welcome to nginx!</title>
#
#      # ШАГ 2. Применяем запрет
#      kubectl apply -f k8s-anatomy/60-networkpolicy-deny-all.yaml
#
#      # ШАГ 3. Тот же запрос должен отвалиться ПО ТАЙМАУТУ
#      kubectl run t2 -n lab --rm -i --restart=Never --image=busybox:1.36 -- `
#        wget -qO- --timeout=4 http://shop-svc
#      # ожидаем "wget: download timed out"
#
#      # ШАГ 4. Снимаем запрет, доступ возвращается
#      kubectl delete -f k8s-anatomy/60-networkpolicy-deny-all.yaml
#
#  ПОЧЕМУ ШАГ 1 НЕ ФОРМАЛЬНОСТЬ
#  Если в namespace уже висит чужая политика с пустым podSelector, трафик
#  не пройдёт ЕЩЁ ДО применения запрета — и можно решить, что демонстрация
#  удалась. Проверить, не мешает ли что-то: kubectl get networkpolicy -A
#
#  ПОЧЕМУ ИМЕННО ТАЙМАУТ, А НЕ "CONNECTION REFUSED"
#  Пакет молча уничтожается в ядре (DROP). Отправитель не получает ничего —
#  ни RST, ни ICMP. Приложение вообще не узнаёт, что его заблокировали.
#  "Connection refused" означал бы, что пакет ДОШЁЛ, а порт закрыт.
#
#  ИМПЕРАТИВНОГО ЭКВИВАЛЕНТА НЕТ
#  kubectl create не умеет создавать NetworkPolicy — только манифест.
#
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-deny-all
  namespace: lab               # политика действует ТОЛЬКО в своём namespace
spec:
  # ---------------------------------------------------------------------------
  #  podSelector — к КАКИМ подам применяется политика (не "кому разрешено").
  #  Пустой podSelector: {} означал бы "ко всем подам namespace" — так пишут
  #  классический default-deny. Здесь выбираем только shop.
  # ---------------------------------------------------------------------------
  podSelector:
    matchLabels:
      app: shop

  # ---------------------------------------------------------------------------
  #  policyTypes — какие НАПРАВЛЕНИЯ берём под контроль.
  #  Указан только Ingress, значит исходящий трафик подов shop не ограничен:
  #  они по-прежнему могут ходить в DNS, в интернет и к другим подам.
  #  Добавили бы Egress — и пришлось бы отдельно разрешать DNS (порт 53
  #  к kube-dns), иначе не резолвится ни одно имя. Это самая частая ошибка
  #  при первом знакомстве с политиками.
  # ---------------------------------------------------------------------------
  policyTypes:
    - Ingress

  # ---------------------------------------------------------------------------
  #  Пустой список правил = разрешено ноль источников = запрещено всё.
  #  Разрешающий вариант — в файле 61-networkpolicy-allow-probe.yaml.
  # ---------------------------------------------------------------------------
  ingress: []
