# =============================================================================
#  61-networkpolicy-allow-probe.yaml  —  точечное разрешение поверх запрета
# =============================================================================
#
#  ЧТО ЭТО ДЕЛАЕТ
#  Разрешает подам с меткой role=probe обращаться к подам app=shop на порт 80.
#  Применяется ВМЕСТЕ с файлом 60, а не вместо него.
#
#  ЗАЧЕМ ЭТОТ ФАЙЛ
#  Файл 60 показывает запрет. Этот показывает главное свойство модели:
#  политики СКЛАДЫВАЮТСЯ. Итоговое разрешение — объединение (OR) всех
#  политик, которые действуют на под. Порядок применения не важен,
#  приоритетов нет, "последняя побеждает" не бывает.
#
#  БОЕВОЙ ШАБЛОН, КОТОРЫЙ ЗДЕСЬ ОТРАБАТЫВАЕТСЯ
#      1) широкий default-deny на весь namespace;
#      2) узкие allow-политики под каждый разрешённый маршрут.
#  Именно так строят изоляцию в проде: запрет по умолчанию, дальше явный
#  белый список. Никаких "запретить конкретному" — таких правил не бывает.
#
#  ПРИМЕНИТЬ (после файла 60)
#      kubectl apply -f k8s-anatomy/60-networkpolicy-deny-all.yaml
#      kubectl apply -f k8s-anatomy/61-networkpolicy-allow-probe.yaml
#
#  ПРОВЕРИТЬ ОБА ИСХОДА — РАЗНИЦА ТОЛЬКО В МЕТКЕ КЛИЕНТА
#      # клиент С меткой role=probe -> проходит
#      kubectl run ok -n lab --rm -i --restart=Never --image=busybox:1.36 `
#        --labels="role=probe" -- wget -qO- --timeout=4 http://shop-svc
#
#      # клиент БЕЗ метки -> таймаут
#      kubectl run no -n lab --rm -i --restart=Never --image=busybox:1.36 `
#        -- wget -qO- --timeout=4 http://shop-svc
#
#  Два одинаковых пода, одна разная метка, противоположный результат.
#  Нагляднее этого механику NetworkPolicy показать нечем.
#
#  ПОСМОТРЕТЬ, ЧТО ДЕЙСТВУЕТ НА ПОД
#      kubectl describe networkpolicy -n lab
#      kubectl get networkpolicy -A        # проверить, нет ли чужих политик
#
#  УДАЛИТЬ
#      kubectl delete -f k8s-anatomy/61-networkpolicy-allow-probe.yaml
#
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-allow-probe
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: shop                # тот же адресат, что и у политики-запрета

  policyTypes:
    - Ingress

  ingress:
    # -------------------------------------------------------------------------
    #  Одно правило = один разрешённый маршрут. Внутри правила from и ports
    #  соединяются логическим И: "из этих источников И на эти порты".
    # -------------------------------------------------------------------------
    - from:
        # ---------------------------------------------------------------------
        #  ВНИМАНИЕ НА СИНТАКСИС — здесь самая частая ошибка во всём YAML
        #  Kubernetes. Элементы списка from объединяются через ИЛИ,
        #  а ключи ВНУТРИ одного элемента — через И.
        #
        #      from:                     from:
        #        - podSelector: {...}      - podSelector: {...}
        #        - namespaceSelector: {}     namespaceSelector: {...}
        #      ^ два элемента: ИЛИ       ^ один элемент: И
        #
        #  Лишний дефис меняет смысл правила на противоположный, и никакой
        #  ошибки при этом не будет: манифест валиден в обоих случаях.
        # ---------------------------------------------------------------------
        - podSelector:
            matchLabels:
              role: probe      # источник — поды с этой меткой В ЭТОМ ЖЕ namespace.
                               # Без namespaceSelector политика НЕ пропустит
                               # трафик из других namespace, даже если там есть
                               # под с точно такой меткой.
      ports:
        - protocol: TCP
          port: 80             # порт НАЗНАЧЕНИЯ, то есть порт в поде-получателе.
                               # Это targetPort, а не port сервиса: политика
                               # применяется после DNAT, когда адрес и порт
                               # уже подменены на подовые. Если бы Service
                               # слушал 8080 и слал на 80, писать надо было бы 80.
