apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: shop
data:
  default.conf: |
    server {
      listen 80;

      # DNS кластера: нужен, чтобы proxy_pass резолвил backend в рантайме,
      # а не один раз при старте nginx (иначе под падает, если backend ещё не готов)
      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

      location = /healthz {
        return 200 "frontend ok\n";
      }

      location / {
        default_type text/plain;
        return 200 "FRONTEND OK. Try /api to reach the backend.\n";
      }

      # проверка связки frontend -> backend через ClusterIP Service
      location /api {
        set $upstream http://backend.shop.svc.cluster.local:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend          # <- на эту метку целятся Service, HTTPRoute (через Service) и NetworkPolicy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  type: ClusterIP              # <- НЕ NodePort: наружу его выставляет только Gateway + HTTPRoute
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
