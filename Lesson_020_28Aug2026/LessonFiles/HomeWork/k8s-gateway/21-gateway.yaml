# Gateway — "точка входа": по этому объекту контроллер поднимает РЕАЛЬНЫЙ прокси
# (Deployment + Service типа LoadBalancer в namespace envoy-gateway-system).
# В Ingress такого объекта не было: контроллер ставился один раз на весь кластер.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  namespace: shop
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same        # <- маршруты (HTTPRoute) принимаются только из namespace shop
