; Ansible inventory — Docker Desktop variant.
; ansible_host values are container NAMES, not IPs — resolved via Docker's
; embedded DNS on the user-defined "ansible-net" network (see Step 1).

[ubuntu]
node1-ubuntu ansible_host=node1-ubuntu ansible_user=root

[centos]
node2-centos ansible_host=node2-centos ansible_user=root

[all:vars]
; Minimal images only ship python3 (no /usr/bin/python symlink) — point Ansible at it explicitly.
ansible_python_interpreter=/usr/bin/python3
