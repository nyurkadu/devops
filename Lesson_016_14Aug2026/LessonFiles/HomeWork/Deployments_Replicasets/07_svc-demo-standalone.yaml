# Одиночный под: НЕ принадлежит Deployment/ReplicaSet (нет лейбла app=svc-demo),
# но имеет tier=web -> попадает в тот же Service.
apiVersion: v1
kind: Pod
metadata:
  name: standalone-web
  labels:
    tier: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command:
        - /bin/sh
        - -c
        - >
          echo "I am STANDALONE pod (no Deployment)" > /usr/share/nginx/html/index.html &&
          exec nginx -g 'daemon off;'
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 3
