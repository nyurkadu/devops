apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-fail
  labels:
    app: probes-fail
spec:
  replicas: 3
  selector:
    matchLabels:
      app: probes-fail
  template:
    metadata:
      labels:
        app: probes-fail
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          # при старте создаём "маркер здоровья" — файл, который отдаётся по /healthz.
          # Удалив его через kubectl exec, получаем 404 и провал соответствующей пробы.
          command:
            - /bin/sh
            - -c
            - >
              echo ok > /usr/share/nginx/html/live &&
              echo ok > /usr/share/nginx/html/ready &&
              echo ok > /usr/share/nginx/html/startup &&
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 80
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /live
              port: 80
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: probes-fail-svc
spec:
  selector:
    app: probes-fail
  ports:
    - port: 80
      targetPort: 80
