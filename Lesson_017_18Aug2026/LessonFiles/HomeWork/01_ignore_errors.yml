---
# ============================================================================
# СЦЕНАРИЙ 1: НЕКРИТИЧНАЯ ОШИБКА
# ----------------------------------------------------------------------------
# Ситуация:  после деплоя отправляем метрику в мониторинг и пробуем остановить
#            старый сервис, которого на хосте может уже не быть.
# Критично?  НЕТ. Мониторинг и legacy-сервис к работе приложения не относятся.
# Реакция:   ignore_errors -> залогировать и продолжить деплой.
# ============================================================================
- name: "S01 | Non-critical failures (ignore_errors)"
  hosts: webservers
  gather_facts: false

  vars:
    monitoring_url: "http://monitoring.invalid:9090/api/deploy"

  tasks:

    - name: "1.1 Send deploy metric to monitoring (best effort)"
      ansible.builtin.uri:
        url: "{{ monitoring_url }}"
        method: POST
        timeout: 3
      register: monitoring_result
      ignore_errors: true
    - name: "1.2 Business decision: monitoring is optional -> only log it"
      ansible.builtin.debug:
        msg: "Monitoring is unreachable, deploy continues. Reason: {{ monitoring_result.msg | default('n/a') }}"
      when: monitoring_result is failed

    - name: "1.3 Stop legacy service (may not exist on this host)"
      ansible.builtin.command: /etc/init.d/legacy-app stop
      register: legacy_stop
      changed_when: false
      ignore_errors: true

    - name: "1.4 Legacy service was already absent"
      ansible.builtin.debug:
        msg: "No legacy-app on this host - nothing to stop."
      when: legacy_stop is failed

    # Критичная задача выполняется, несмотря на две упавшие выше.
    - name: "1.5 Critical step still runs: nginx binary must be present"
      ansible.builtin.command: nginx -v
      register: nginx_ver
      changed_when: false

    - name: "1.6 Show nginx version"
      ansible.builtin.debug:
        msg: "{{ nginx_ver.stderr | default(nginx_ver.stdout, true) | trim }}"
