---
# ============================================================================
# СЦЕНАРИЙ 3: ЧТО СЧИТАТЬ ИЗМЕНЕНИЕМ
# ----------------------------------------------------------------------------
# Ситуация A: read-only проверки (uptime, loadavg) через модуль command
#             ВСЕГДА рапортуют "changed" - Ansible не знает семантику команды.
# Критично?   Не ошибка, но ложный шум: ломает идемпотентность отчёта.
# Реакция:    changed_when: false.
#
# Ситуация B: скрипт синхронизации конфига запускается каждый раз, но реально
#             меняет файл только когда конфиг отличается.
# Критично?   Важно: от "changed" зависит запуск handler (перезагрузка сервиса).
# Реакция:    changed_when по стдауту -> handler срабатывает только по делу.
# ============================================================================
- name: "S03 | What counts as a change (changed_when + handlers)"
  hosts: webservers
  gather_facts: false

  vars:
    app_port: 8080             # поменяй через -e, чтобы получить changed снова
    app_dir: /opt/app
    bin_dir: /usr/local/bin

  tasks:

    # --- A: read-only команды --------------------------------------------
    - name: "3.1 Read-only check: uptime (never a change)"
      ansible.builtin.command: uptime
      register: uptime_out
      changed_when: false

    - name: "3.2 Read-only check: load average (never a change)"
      ansible.builtin.command: cat /proc/loadavg
      register: loadavg_out
      changed_when: false

    - name: "3.3 Health snapshot"
      ansible.builtin.debug:
        msg: "uptime: {{ uptime_out.stdout | trim }} | loadavg: {{ loadavg_out.stdout | trim }}"

    # --- B: реальное изменение конфига -----------------------------------
    - name: "3.4 Ensure application directory exists"
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: "3.5 Render the new config (module tracks changes itself)"
      ansible.builtin.copy:
        dest: "{{ app_dir }}/config.new"
        mode: '0644'
        content: |
          # generated by ansible
          listen_port={{ app_port }}
          workers=4

    - name: "3.6 Deploy the sync script"
      ansible.builtin.copy:
        dest: "{{ bin_dir }}/sync_config.sh"
        mode: '0755'
        content: |
          #!/bin/sh
          SRC={{ app_dir }}/config.new
          DST={{ app_dir }}/config.active
          if [ ! -f "$SRC" ]; then
              echo "ERROR: $SRC not found"
              exit 1
          fi
          if [ -f "$DST" ] && cmp -s "$SRC" "$DST"; then
              echo "config unchanged"
              exit 0
          fi
          cp "$SRC" "$DST"
          echo "config updated"
          exit 0

    - name: "3.7 Sync config (changed ONLY when it really changed)"
      ansible.builtin.command: "{{ bin_dir }}/sync_config.sh"
      register: sync
      changed_when: "'config updated' in sync.stdout"
      failed_when: sync.rc != 0
      notify: Reload application

    - name: "3.8 Sync verdict"
      ansible.builtin.debug:
        msg: "sync_config.sh -> {{ sync.stdout | trim }}"

  handlers:

    - name: Reload application
      ansible.builtin.shell: >
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) reloaded, listen_port={{ app_port }}"
        >> /var/log/app-reload.log
